<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>库管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 13px;
    color: #1A1B1C;
    background: #F4F3EE;
    padding: 12px;
    overflow-x: hidden;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header h3 {
    font-size: 14px;
    font-weight: 600;
  }
  .btn {
    padding: 4px 10px;
    border: 1px solid #E4E3DD;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 12px;
    color: #1A1B1C;
    transition: all 0.15s;
  }
  .btn:hover { background: #EFEFEA; }
  .btn-primary {
    background: #2563EB;
    color: #fff;
    border-color: #2563EB;
  }
  .btn-primary:hover { background: #1D4ED8; }
  .btn-danger {
    color: #DC2626;
    border-color: #FECACA;
  }
  .btn-danger:hover { background: #FEF2F2; }
  .btn-success {
    color: #16A34A;
    border-color: #BBF7D0;
  }
  .btn-success:hover { background: #F0FDF4; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .search-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .search-bar input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 5px 8px;
    border: 1px solid #E4E3DD;
    border-radius: 6px;
    font-size: 12px;
    background: #fff;
  }
  .search-bar input:focus { outline: none; border-color: #2563EB; }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    border-bottom: 1px solid #E4E3DD;
  }
  .tab {
    padding: 6px 12px;
    cursor: pointer;
    font-size: 12px;
    color: #6B7280;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active {
    color: #2563EB;
    border-bottom-color: #2563EB;
    font-weight: 500;
  }
  .library-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .library-item {
    padding: 8px 10px;
    background: #fff;
    border: 1px solid #E4E3DD;
    border-radius: 8px;
  }
  .library-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .library-name {
    font-weight: 500;
    font-size: 13px;
  }
  .library-meta {
    font-size: 11px;
    color: #6B7280;
    margin-top: 2px;
  }
  .library-desc {
    font-size: 12px;
    color: #4B5563;
    margin-top: 4px;
    line-height: 1.4;
  }
  .library-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .progress-wrap {
    margin-top: 8px;
  }
  .progress-bar {
    height: 4px;
    background: #E4E3DD;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #2563EB;
    transition: width 0.3s;
  }
  .progress-text {
    font-size: 11px;
    color: #6B7280;
    margin-top: 4px;
  }
  .empty {
    text-align: center;
    padding: 24px;
    color: #6B7280;
    font-size: 12px;
  }
  .loading {
    text-align: center;
    padding: 16px;
    color: #6B7280;
    font-size: 12px;
  }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 500;
    margin-left: 6px;
  }
  .badge-installed { background: #DCFCE7; color: #166534; }
  .badge-update { background: #FEF3C7; color: #92400E; }
</style>
</head>
<body>
  <div class="header">
    <h3>📚 库管理</h3>
    <button class="btn" onclick="refresh()">↻ 刷新</button>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索库（如 WiFi、Servo、Adafruit）…" onkeydown="if(event.key==='Enter')searchLibraries()">
    <button class="btn btn-primary" onclick="searchLibraries()">搜索</button>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabInstalled" onclick="switchTab('installed')">已安装</div>
    <div class="tab" id="tabSearch" onclick="switchTab('search')">搜索结果</div>
  </div>

  <div id="installedList" class="library-list">
    <div class="loading">加载中…</div>
  </div>

  <div id="searchList" class="library-list" style="display:none;">
    <div class="empty">输入关键词搜索 Arduino 库</div>
  </div>

  <div id="progressWrap" class="progress-wrap" style="display:none;">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">准备安装…</div>
  </div>

<script>
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function callHost(method, args) {
    return new Promise((resolve, reject) => {
      const id = Date.now() + Math.random();
      const handler = (e) => {
        if (e.data && e.data.id === id) {
          window.removeEventListener('message', handler);
          if (e.data.error) reject(new Error(e.data.error));
          else resolve(e.data.result);
        }
      };
      window.addEventListener('message', handler);
      window.parent.postMessage({ type: 'plugin:invoke', id, method, args }, '*');
      setTimeout(() => {
        window.removeEventListener('message', handler);
        reject(new Error('timeout'));
      }, 30000);
    });
  }

  let installedLibraries = [];
  let searchResults = [];
  let currentTab = 'installed';

  async function loadInstalled() {
    const list = document.getElementById('installedList');
    list.innerHTML = '<div class="loading">加载中…</div>';
    try {
      const result = await callHost('library:list', {});
      installedLibraries = result.libraries || [];
      renderInstalled();
    } catch (e) {
      list.innerHTML = '<div class="empty">加载失败: ' + escapeHtml(e.message) + '</div>';
    }
  }

  async function searchLibraries() {
    const keyword = document.getElementById('searchInput').value.trim();
    if (!keyword) return;
    switchTab('search');
    const list = document.getElementById('searchList');
    list.innerHTML = '<div class="loading">搜索中…</div>';
    try {
      const result = await callHost('library:search', { keyword });
      searchResults = result.libraries || [];
      renderSearch();
    } catch (e) {
      list.innerHTML = '<div class="empty">搜索失败: ' + escapeHtml(e.message) + '</div>';
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabInstalled').classList.toggle('active', tab === 'installed');
    document.getElementById('tabSearch').classList.toggle('active', tab === 'search');
    document.getElementById('installedList').style.display = tab === 'installed' ? 'flex' : 'none';
    document.getElementById('searchList').style.display = tab === 'search' ? 'flex' : 'none';
  }

  function renderInstalled() {
    const list = document.getElementById('installedList');
    if (installedLibraries.length === 0) {
      list.innerHTML = '<div class="empty">暂无已安装库</div>';
      return;
    }
    list.innerHTML = installedLibraries.map(lib => `
      <div class="library-item">
        <div class="library-header">
          <div>
            <span class="library-name">${escapeHtml(lib.name)}</span>
            <span class="badge badge-installed">v${escapeHtml(lib.version || '?')}</span>
          </div>
          <div class="library-actions">
            ${lib.updateAvailable ? `<button class="btn btn-success" onclick="installLibrary('${escapeHtml(lib.name)}')">更新</button>` : ''}
            <button class="btn btn-danger" onclick="uninstallLibrary('${escapeHtml(lib.name)}')">卸载</button>
          </div>
        </div>
        ${lib.author ? `<div class="library-meta">作者: ${escapeHtml(lib.author)}</div>` : ''}
        ${lib.sentence ? `<div class="library-desc">${escapeHtml(lib.sentence)}</div>` : ''}
      </div>
    `).join('');
  }

  function renderSearch() {
    const list = document.getElementById('searchList');
    if (searchResults.length === 0) {
      list.innerHTML = '<div class="empty">无匹配结果</div>';
      return;
    }
    const installedNames = new Set(installedLibraries.map(l => l.name));
    list.innerHTML = searchResults.map(lib => `
      <div class="library-item">
        <div class="library-header">
          <div>
            <span class="library-name">${escapeHtml(lib.name)}</span>
            ${installedNames.has(lib.name) ? '<span class="badge badge-installed">已安装</span>' : ''}
          </div>
          <div class="library-actions">
            <button class="btn btn-primary" onclick="installLibrary('${escapeHtml(lib.name)}')">
              ${installedNames.has(lib.name) ? '重新安装' : '安装'}
            </button>
          </div>
        </div>
        ${lib.author ? `<div class="library-meta">作者: ${escapeHtml(lib.author)} · v${escapeHtml(lib.latestVersion || lib.version || '?')}</div>` : ''}
        ${lib.sentence ? `<div class="library-desc">${escapeHtml(lib.sentence)}</div>` : ''}
      </div>
    `).join('');
  }

  async function installLibrary(name) {
    const wrap = document.getElementById('progressWrap');
    const fill = document.getElementById('progressFill');
    const text = document.getElementById('progressText');
    wrap.style.display = 'block';
    fill.style.width = '0%';
    text.textContent = '准备安装 ' + name + '…';

    try {
      const progressHandler = (e) => {
        if (e.data && e.data.type === 'library:install-progress') {
          fill.style.width = (e.data.percent || 0) + '%';
          text.textContent = e.data.message || '安装中…';
        }
      };
      window.addEventListener('message', progressHandler);

      await callHost('library:install', { name });
      window.removeEventListener('message', progressHandler);
      text.textContent = '安装成功！';
      fill.style.width = '100%';
      setTimeout(() => { wrap.style.display = 'none'; loadInstalled(); }, 1000);
    } catch (e) {
      text.textContent = '安装失败: ' + e.message;
      setTimeout(() => { wrap.style.display = 'none'; }, 3000);
    }
  }

  async function uninstallLibrary(name) {
    if (!confirm('确定要卸载 ' + name + ' 吗？')) return;
    try {
      await callHost('library:uninstall', { name });
      loadInstalled();
    } catch (e) {
      alert('卸载失败: ' + e.message);
    }
  }

  function refresh() {
    if (currentTab === 'installed') loadInstalled();
    else searchLibraries();
  }

  window.parent.postMessage({ type: 'ready', view: 'libraries' }, '*');
  loadInstalled();
</script>
</body>
</html>
